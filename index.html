<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbet Uygulaması - Discute</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Playfair Display & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (v9 Modular Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            background-image: linear-gradient(rgba(245, 240, 235, 0.85), rgba(235, 228, 220, 0.90)), 
                              url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            color: #2c2c2c;
        }

        .french-title {
            font-family: 'Playfair Display', serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 35px rgba(50, 40, 30, 0.1);
        }

        .btn-french {
            background: linear-gradient(135deg, #722F37 0%, #4A1525 100%);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .btn-french:hover {
            background: linear-gradient(135deg, #853742 0%, #5a1a2e 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(114, 47, 55, 0.3);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-2 sm:p-4 antialiased selection:bg-rose-900 selection:text-white">

    <!-- APP CONTAINER -->
    <div id="app" class="w-full max-w-3xl h-full max-h-[92vh] flex flex-col glass-card rounded-2xl overflow-hidden relative border border-white/60">
        
        <!-- HEADER -->
        <header class="bg-[#722F37] text-white p-4 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-rose-900/50 rounded-full flex items-center justify-center font-bold text-lg border border-rose-300/30">
                    <i class="fa-solid fa-comments text-amber-100"></i>
                </div>
                <div>
                    <h1 class="french-title font-bold text-xl tracking-wide text-amber-50">Salon de Discussion</h1>
                    <span id="userBadge" class="text-xs text-rose-200 block hidden">
                        <i class="fa-solid fa-circle text-emerald-400 text-[9px] mr-1"></i>
                        <span id="currentUsername"></span>
                    </span>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button id="logoutBtn" onclick="logout()" class="p-2 hover:bg-rose-800 rounded-lg text-rose-100 transition-colors hidden" title="Déconnexion (Çıkış)">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </button>
            </div>
        </header>

        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="flex-1 flex flex-col items-center justify-center p-6">
            <div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-2xl shadow-xl p-8 border border-white">
                <div class="text-center mb-6">
                    <div class="inline-flex p-3 bg-rose-50 text-[#722F37] rounded-full mb-3 border border-rose-100">
                        <i class="fa-solid fa-lock text-2xl"></i>
                    </div>
                    <h2 class="french-title text-2xl font-bold text-gray-800">Bienvenue</h2>
                    <p class="text-xs text-gray-500 mt-1">Sohbete katılmak için kullanıcı adınızı ve ortak şifreyi girin</p>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Kullanıcı Adı / Rumuz</label>
                        <input type="text" id="usernameInput" required placeholder="Örn: Jean / Ahmet" autocomplete="off"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#722F37] focus:border-[#722F37] outline-none transition bg-white/80 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Ortak Oda Şifresi</label>
                        <input type="password" id="passwordInput" required placeholder="••••••••" autocomplete="new-password"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#722F37] focus:border-[#722F37] outline-none transition bg-white/80 text-sm">
                        <p class="text-xs text-gray-400 mt-1">Şifre: <span class="font-mono bg-amber-50 text-amber-900 px-1.5 py-0.5 rounded border border-amber-200">123456</span></p>
                    </div>
                    <button type="submit" class="w-full btn-french font-medium py-3 rounded-xl transition duration-200 shadow-md flex items-center justify-center space-x-2 text-sm">
                        <span>Odaya Katıl</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chatScreen" class="flex-1 flex flex-col hidden overflow-hidden bg-white/40 backdrop-blur-sm relative">
            <!-- Messages List -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Dynamic Messages -->
            </div>

            <!-- Message Input Form -->
            <form id="messageForm" onsubmit="sendMessage(event)" class="p-3 bg-white/90 border-t border-rose-100 flex items-center space-x-2">
                <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." autocomplete="off"
                    class="flex-1 px-4 py-2.5 border border-gray-300 rounded-full focus:ring-2 focus:ring-[#722F37] focus:border-[#722F37] outline-none transition text-sm bg-white">
                
                <button type="submit" id="sendBtn" class="btn-french p-3 rounded-full transition shadow-md flex items-center justify-center w-11 h-11 shrink-0">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Sabit Firebase Konfigürasyonu (Tüm cihazlarda doğrudan çalışır)
        const firebaseConfig = {
            apiKey: "AIzaSyCgoQTlk16RbjZI6ynRrYBOhqYUx9EoMlg",
            authDomain: "mydiscute.firebaseapp.com",
            projectId: "mydiscute",
            storageBucket: "mydiscute.firebasestorage.app",
            messagingSenderId: "780572330170",
            appId: "1:780572330170:web:a2953844c71ae8720f1a83"
        };

        const SHARED_PASSWORD = "123456";
        let db = null;
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', () => {
            initFirebase();
        });

        function initFirebase() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
            } catch (e) {
                console.error("Firebase başlatma hatası:", e);
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (password !== SHARED_PASSWORD) {
                alert("Hatalı ortak şifre!");
                return;
            }

            if (username) {
                currentUser = username;
                showChatScreen();
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('chatScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('userBadge').classList.add('hidden');
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
        }

        function showChatScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('userBadge').classList.remove('hidden');
            document.getElementById('currentUsername').innerText = currentUser;

            loadMessages();
        }

        function loadMessages() {
            db.collection("messages").orderBy("timestamp", "asc")
                .onSnapshot((snapshot) => {
                    const container = document.getElementById('messagesContainer');
                    container.innerHTML = '';

                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const isMe = data.sender === currentUser;
                        
                        const msgDiv = document.createElement('div');
                        msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} group`;

                        const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

                        msgDiv.innerHTML = `
                            <div class="flex items-center space-x-1 max-w-[85%] sm:max-w-[75%]">
                                ${isMe ? `
                                    <button onclick="deleteMessage('${doc.id}')" class="opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-rose-600 p-1 text-xs" title="Mesajı Sil">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                ` : ''}
                                <div class="${isMe ? 'bg-[#722F37] text-white rounded-l-2xl rounded-tr-2xl shadow-md' : 'bg-white text-gray-800 rounded-r-2xl rounded-tl-2xl shadow-sm border border-gray-100'} p-3 text-left">
                                    <div class="text-[10px] font-bold ${isMe ? 'text-amber-200' : 'text-[#722F37]'} mb-0.5">${escapeHtml(data.sender)}</div>
                                    <p class="text-sm break-words leading-relaxed">${escapeHtml(data.text || '')}</p>
                                    <div class="text-[9px] ${isMe ? 'text-rose-200' : 'text-gray-400'} text-right mt-1 font-mono">${time}</div>
                                </div>
                            </div>
                        `;

                        container.appendChild(msgDiv);
                    });

                    container.scrollTop = container.scrollHeight;
                }, (error) => {
                    console.error("Mesaj yükleme hatası:", error);
                });
        }

        async function sendMessage(e) {
            e.preventDefault();
            const textInput = document.getElementById('messageInput');
            const text = textInput.value.trim();

            if (!text) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                await db.collection("messages").add({
                    sender: currentUser,
                    text: text,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                textInput.value = '';
            } catch (err) {
                alert("Mesaj gönderilemedi: " + err.message);
                console.error(err);
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function deleteMessage(docId) {
            if (confirm("Bu mesajı silmek istediğinize emin misiniz?")) {
                try {
                    await db.collection("messages").doc(docId).delete();
                } catch (err) {
                    alert("Silme hatası: " + err.message);
                }
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
